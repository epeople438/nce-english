<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lesson 3 · Sorry, sir.</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6A1B9A;
    --primary-dark: #4A148C;
    --primary-light: #F3E5F5;
    --accent: #FF6F00;
    --accent2: #00ACC1;
    --bg: #FDF5FF;
    --text: #1A0033;
    --correct: #43A047;
    --wrong: #E53935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .topbar {
    background: var(--primary); color: white;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(106,27,154,0.35);
  }
  .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .back-btn:hover { background: rgba(255,255,255,0.3); }
  .topbar-title { font-family: 'Fredoka One', cursive; font-size: 17px; text-align: center; }
  .stars-bar { display: flex; gap: 4px; }
  .star { font-size: 20px; }
  .star.earned { animation: starPop 0.5s ease; }
  @keyframes starPop { 0%{transform:scale(1)} 50%{transform:scale(1.6) rotate(15deg)} 100%{transform:scale(1)} }

  .progress-wrap { height: 6px; background: #E1BEE7; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #AB47BC, #FF6F00); transition: width 0.5s ease; border-radius: 0 3px 3px 0; }

  .stage-dots { display: flex; justify-content: center; gap: 8px; padding: 14px 0 6px; }
  .stage-dot { width: 32px; height: 8px; border-radius: 4px; background: #E1BEE7; transition: background 0.3s, transform 0.2s; }
  .stage-dot.active { background: var(--primary); transform: scaleY(1.5); }
  .stage-dot.done { background: var(--accent); }

  .screen { display: none; animation: fadeIn 0.4s ease; padding: 12px 16px 40px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px; position: relative; overflow: hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background: linear-gradient(90deg, #AB47BC, #FF6F00, #00ACC1, #43A047, #1565C0); }
  .card-title { font-family: 'Fredoka One', cursive; font-size: 16px; color: var(--primary-dark); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

  /* SCENE */
  .scene-banner {
    background: linear-gradient(135deg, #4A148C, #7B1FA2);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .scene-icon { font-size: 36px; }
  .scene-desc { color: white; font-size: 13px; font-weight: 700; line-height: 1.5; }
  .scene-desc b { font-size: 15px; display: block; margin-bottom: 2px; }

  /* DIALOGUE */
  .dlg-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border-radius: 14px; cursor: pointer; transition: background 0.2s, transform 0.15s; opacity: 0.5;
  }
  .dlg-item.active { opacity: 1; background: var(--primary-light); transform: scale(1.01); }
  .dlg-item.done { opacity: 0.85; }
  .dlg-who { font-family: 'Fredoka One', cursive; font-size: 12px; color: white; background: var(--primary); padding: 2px 8px; border-radius: 10px; white-space: nowrap; margin-top: 2px; flex-shrink: 0; }
  .dlg-who.b { background: #1565C0; }
  .dlg-text { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.4; }
  .dlg-cn { font-size: 12px; color: #888; margin-top: 2px; }
  .dlg-play { margin-left: auto; font-size: 18px; opacity: 0.4; flex-shrink: 0; }
  .dlg-item.active .dlg-play { opacity: 1; }

  /* VOCAB */
  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vocab-card { background: var(--primary-light); border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent; }
  .vocab-card:active { transform: scale(0.96); }
  .vocab-card.playing { border-color: var(--primary); background: white; box-shadow: 0 4px 12px rgba(106,27,154,0.2); }
  .vocab-emoji { font-size: 28px; margin-bottom: 4px; }
  .vocab-en { font-family: 'Fredoka One', cursive; font-size: 15px; color: var(--primary-dark); }
  .vocab-cn { font-size: 12px; color: #666; margin-top: 2px; }

  /* SORRY GAME — 情景选词 */
  .sorry-scene {
    background: var(--primary-light); border-radius: 18px; padding: 16px;
    text-align: center; margin-bottom: 14px;
    border: 2px solid #CE93D8; transition: border-color 0.3s;
  }
  .sorry-scene.correct-anim { border-color: var(--correct); animation: correctPop 0.4s ease; }
  .sorry-scene.wrong-anim { border-color: var(--wrong); animation: shake 0.4s ease; }
  @keyframes correctPop { 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
  .sorry-emoji { font-size: 52px; margin-bottom: 8px; }
  .sorry-situation { font-family: 'Fredoka One', cursive; font-size: 15px; color: var(--primary-dark); margin-bottom: 6px; }
  .sorry-context { font-size: 13px; color: #888; margin-bottom: 12px; }
  .sorry-role-tag {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-family: 'Fredoka One', cursive; font-size: 12px; color: white;
    margin-bottom: 10px;
  }
  .sorry-role-tag.responder { background: #1565C0; }
  .sorry-role-tag.apologizer { background: var(--primary); }
  .sorry-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sorry-opt {
    padding: 13px 8px; border-radius: 14px; border: 2px solid #CE93D8;
    background: white; font-family: 'Fredoka One', cursive; font-size: 14px;
    cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.4;
  }
  .sorry-opt:hover { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }
  .sorry-opt:active { transform: scale(0.95); }
  .sorry-opt.correct { background: #E8F5E9; border-color: var(--correct); color: var(--correct); }
  .sorry-opt.wrong { background: #FFEBEE; border-color: var(--wrong); color: var(--wrong); }
  .sorry-progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .sorry-dot { width: 10px; height: 10px; border-radius: 50%; background: #E1BEE7; transition: background 0.3s; }
  .sorry-dot.correct { background: var(--correct); }
  .sorry-dot.wrong { background: var(--wrong); }
  .sorry-score { text-align: center; font-family: 'Fredoka One', cursive; font-size: 14px; color: #888; margin-bottom: 12px; }
  .rule-box { background: #FFF8E1; border: 2px solid #FFB300; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; font-weight: 700; color: #5D4037; text-align: center; line-height: 1.9; }
  .rule-tag { display: inline-block; background: white; border-radius: 8px; padding: 1px 8px; margin: 1px 3px; font-size: 13px; }

  /* FILL */
  .fill-question { background: white; border: 2px solid #E1BEE7; border-radius: 18px; padding: 16px; margin-bottom: 12px; transition: border-color 0.3s; }
  .fill-question.correct-anim { border-color: var(--correct); animation: correctPop 0.4s ease; }
  .fill-question.wrong-anim { border-color: var(--wrong); animation: shake 0.4s ease; }
  .fill-sent { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 10px; line-height: 1.5; }
  .fill-sent .blank-word { display: inline-block; min-width: 60px; text-align: center; border-bottom: 2px dashed var(--primary); color: var(--primary); font-style: italic; }
  .fill-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .fill-opt { padding: 7px 16px; border-radius: 50px; border: 2px solid #E1BEE7; background: white; font-family: 'Fredoka One', cursive; font-size: 15px; cursor: pointer; transition: all 0.2s; }
  .fill-opt:hover { border-color: var(--primary); background: var(--primary-light); }
  .fill-opt.selected-correct { background: #E8F5E9; border-color: var(--correct); color: var(--correct); }
  .fill-opt.selected-wrong { background: #FFEBEE; border-color: var(--wrong); color: var(--wrong); }
  .fill-cn { font-size: 13px; color: #999; margin-top: 6px; }
  .fill-score-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .fill-dot { width: 10px; height: 10px; border-radius: 50%; background: #E1BEE7; transition: background 0.3s; }
  .fill-dot.correct { background: var(--correct); }
  .fill-dot.wrong { background: var(--wrong); }

  .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-family: 'Fredoka One', cursive; font-size: 18px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; margin-top: 8px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(106,27,154,0.35); }
  .btn-primary:hover { box-shadow: 0 6px 18px rgba(106,27,154,0.45); }
  .btn-disabled { background: #B0BEC5; color: white; cursor: not-allowed; box-shadow: none; }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #333; color: white; padding: 12px 24px; border-radius: 50px; font-size: 15px; font-weight: 700; z-index: 999; transition: transform 0.3s ease; white-space: nowrap; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.green { background: var(--correct); }
  .toast.red { background: var(--wrong); }

  .confetti-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 998; }
  .cf { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: cfFall linear forwards; }
  @keyframes cfFall { 0%{top:-20px;transform:rotate(0deg) scale(1);opacity:1} 80%{opacity:1} 100%{top:110vh;transform:rotate(720deg) scale(0.5);opacity:0} }

  .finish-card { text-align: center; padding: 30px 20px; }
  .finish-emoji { font-size: 64px; margin-bottom: 12px; }
  .finish-title { font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--primary-dark); margin-bottom: 8px; }
  .finish-stars { font-size: 36px; letter-spacing: 4px; margin-bottom: 16px; }
  .finish-review { background: var(--primary-light); border-radius: 16px; padding: 16px; text-align: left; margin-top: 16px; }
  .finish-review-title { font-family: 'Fredoka One', cursive; color: var(--primary); font-size: 15px; margin-bottom: 10px; }
  .review-line { font-size: 14px; font-weight: 700; color: var(--text); padding: 6px 0; border-bottom: 1px solid #CE93D8; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .review-line:last-child { border-bottom: none; }
  .review-play { color: var(--primary); }
</style>
</head>
<body>

<div class="topbar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="topbar-title">Lesson 3 · Sorry, sir.</div>
  <div class="stars-bar">
    <span class="star" id="star1">☆</span><span class="star" id="star2">☆</span>
    <span class="star" id="star3">☆</span><span class="star" id="star4">☆</span>
  </div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="stage-dots">
  <div class="stage-dot active" id="dot0"></div>
  <div class="stage-dot" id="dot1"></div>
  <div class="stage-dot" id="dot2"></div>
  <div class="stage-dot" id="dot3"></div>
</div>

<!-- SCREEN 1: DIALOGUE -->
<div class="screen active" id="screen1">
  <div class="card">
    <div class="scene-banner">
      <div class="scene-icon">🧥</div>
      <div class="scene-desc">
        <b>场景：衣帽存放处</b>
        一位男士凭票来取他的外套和雨伞，但领到的雨伞不是他的！
      </div>
    </div>
    <div class="card-title">🎬 第一关：听故事</div>
    <div style="text-align:center;font-size:13px;color:#888;margin-bottom:12px;">点击每一句，听对话朗读 👂</div>
    <div id="dialogueList"></div>
  </div>
  <button class="btn btn-disabled" id="btn1" onclick="goStage(2)">全部听完才能继续 🔒</button>
</div>

<!-- SCREEN 2: VOCAB -->
<div class="screen" id="screen2">
  <div class="card">
    <div class="card-title">📖 第二关：认单词</div>
    <div style="text-align:center;font-size:13px;color:#888;margin-bottom:14px;">点击卡片，听发音 🔊</div>
    <div class="vocab-grid" id="vocabGrid"></div>
  </div>
  <button class="btn btn-primary" onclick="goStage(3)">下一关 →</button>
</div>

<!-- SCREEN 3: SORRY GAME -->
<div class="screen" id="screen3">
  <div class="card">
    <div class="card-title">🎮 第三关：道歉情景选词</div>
    <div class="rule-box">
      📌 道歉时说：<span class="rule-tag">Sorry!</span> <span class="rule-tag">I'm sorry.</span><br>
      回应道歉时说：<span class="rule-tag">That's all right.</span> <span class="rule-tag">Never mind.</span>
    </div>
    <div class="sorry-progress" id="sorryProgress"></div>
    <div class="sorry-score" id="sorryScore">第 1 题 / 共 6 题</div>
    <div class="sorry-scene" id="sorryScene">
      <div class="sorry-emoji" id="sorryEmoji"></div>
      <div class="sorry-situation" id="sorrySituation"></div>
      <div class="sorry-context" id="sorryContext"></div>
      <div id="sorryRoleTag"></div>
      <div class="sorry-options" id="sorryOptions"></div>
    </div>
  </div>
  <button class="btn btn-disabled" id="btn3" onclick="goStage(4)">完成全部题目 🔒</button>
</div>

<!-- SCREEN 4: FILL -->
<div class="screen" id="screen4">
  <div class="card">
    <div class="card-title">✏️ 第四关：填一填</div>
    <div class="fill-score-row" id="fillDots"></div>
    <div id="fillQuestions"></div>
  </div>
  <button class="btn btn-disabled" id="btn4" onclick="finishLesson()">完成全部题目 🔒</button>
</div>

<!-- SCREEN 5: FINISH -->
<div class="screen" id="screen5">
  <div class="card finish-card">
    <div class="finish-emoji">🎉</div>
    <div class="finish-title">太棒了！</div>
    <div class="finish-stars" id="finishStars"></div>
    <div style="font-size:15px;color:#666;margin-bottom:8px;">第3课完成！<br>你学会了道歉与回应 😊</div>
    <div class="finish-review">
      <div class="finish-review-title">📖 复习本课对话</div>
      <div id="reviewList"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:20px;" onclick="location.href='lesson4.html'">去第4课 →</button>
    <button class="btn" style="background:#F3E5F5;color:var(--primary-dark);margin-top:8px;" onclick="location.href='../index.html'">回主页 🏠</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="confetti-wrap" id="confettiWrap"></div>

<script>
// ★ 真实课文原文（新概念第一册 Lesson 3）
const dialogue = [
  { who: 'Man', cls: 'b', en: 'My coat and my umbrella please.', cn: '请把我的大衣和雨伞给我。' },
  { who: 'Attendant', cls: '', en: 'Here is my ticket.', cn: '（男士）这是我的号牌。' },
  { who: 'Attendant', cls: '', en: 'Thank you, sir. Number five.', cn: '谢谢您，先生。5号。' },
  { who: 'Attendant', cls: '', en: "Here's your umbrella and your coat.", cn: '这是您的雨伞和大衣。' },
  { who: 'Man', cls: 'b', en: 'This is not my umbrella.', cn: '这不是我的雨伞。' },
  { who: 'Attendant', cls: '', en: 'Sorry, sir.', cn: '对不起，先生。' },
  { who: 'Attendant', cls: '', en: 'Is this your umbrella?', cn: '这把是您的雨伞吗？' },
  { who: 'Man', cls: 'b', en: "No, it isn't.", cn: '不，不是。' },
  { who: 'Attendant', cls: '', en: 'Is this it?', cn: '这把呢？' },
  { who: 'Man', cls: 'b', en: 'Yes, it is. Thank you very much.', cn: '是的，就是这把。非常感谢。' },
];

const vocab = [
  { emoji: '🧥', en: 'coat', cn: '大衣' },
  { emoji: '☂️', en: 'umbrella', cn: '雨伞' },
  { emoji: '🎫', en: 'ticket', cn: '（寄存）票牌' },
  { emoji: '5️⃣', en: 'number', cn: '号码' },
  { emoji: '🙏', en: 'please', cn: '请' },
  { emoji: '🗂️', en: 'cloakroom', cn: '衣帽存放处' },
  { emoji: '🙇', en: 'sorry', cn: '对不起' },
  { emoji: '🎩', en: 'sir', cn: '先生（尊称）' },
];

// 情景选词游戏：区分"道歉方"和"回应方"
const sorryQuestions = [
  {
    emoji: '😟', situation: '服务员给错了雨伞',
    context: '是服务员说……', role: 'apologizer', roleLabel: '说道歉的一方',
    options: ['Sorry, sir.', "That's all right.", 'Thank you.', 'Never mind.'],
    answer: 'Sorry, sir.',
  },
  {
    emoji: '😮', situation: '顾客说"这不是我的雨伞"',
    context: '这时服务员应该说……', role: 'apologizer', roleLabel: '道歉方',
    options: ['Sorry, sir.', 'Thank you very much.', "That's all right.", 'Here you are.'],
    answer: 'Sorry, sir.',
  },
  {
    emoji: '😊', situation: '有人不小心踩了你的脚，跟你道歉',
    context: '你会怎么回应？', role: 'responder', roleLabel: '回应道歉',
    options: ["That's all right.", 'Sorry!', "I'm sorry.", 'Excuse me.'],
    answer: "That's all right.",
  },
  {
    emoji: '🤦', situation: '你不小心把朋友的书弄湿了',
    context: '你该说……', role: 'apologizer', roleLabel: '道歉方',
    options: ["I'm sorry.", "That's all right.", 'Never mind.', 'Thank you.'],
    answer: "I'm sorry.",
  },
  {
    emoji: '🙆', situation: '朋友向你道歉，你想告诉他没关系',
    context: '你可以说……', role: 'responder', roleLabel: '回应道歉',
    options: ['Never mind.', "I'm sorry.", 'Sorry, sir.', 'Excuse me.'],
    answer: 'Never mind.',
  },
  {
    emoji: '😌', situation: '你把同学的铅笔弄断了，对方说没关系',
    context: '对方说的是……', role: 'responder', roleLabel: '回应道歉',
    options: ["That's all right.", 'Sorry!', "I'm sorry.", 'Thank you.'],
    answer: "That's all right.",
  },
];

const fillQuestions = [
  { sentence: 'My coat and my ___ please.', blank: 'umbrella', options: ['umbrella', 'coat', 'bag', 'ticket'], answer: 'umbrella', cn: '请把我的大衣和雨伞给我。' },
  { sentence: 'Here is my ___.', blank: 'ticket', options: ['ticket', 'coat', 'number', 'bag'], answer: 'ticket', cn: '这是我的票牌。' },
  { sentence: 'This is ___ my umbrella.', blank: 'not', options: ['not', 'no', "isn't", 'never'], answer: 'not', cn: '这不是我的雨伞。' },
  { sentence: '___, sir.', blank: 'Sorry', options: ['Sorry', 'Pardon', 'Please', 'Thank'], answer: 'Sorry', cn: '对不起，先生。' },
  { sentence: 'Is this ___?', blank: 'it', options: ['it', 'your', 'my', 'his'], answer: 'it', cn: '这把是（您要找的那个）吗？' },
  { sentence: 'Yes, ___ is. Thank you very much.', blank: 'it', options: ['it', 'this', 'that', 'he'], answer: 'it', cn: '是的，就是这把。非常感谢。' },
];

let currentStage = 1, starsEarned = 0;
let dlgDone = new Set();
let sorryIndex = 0, sorryCorrect = 0;
let fillAnswered = 0;

window.onload = () => { renderDialogue(); renderVocab(); renderSorryProgress(); renderSorryQuestion(); renderFillQuestions(); updateProgress(0); };

function speak(text, rate=0.88) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate;
  const voices = window.speechSynthesis.getVoices();
  for (const p of ['Samantha','Google US English','Daniel','Karen']) {
    const v = voices.find(v => v.name.includes(p));
    if (v) { u.voice = v; break; }
  }
  window.speechSynthesis.speak(u);
}

function renderDialogue() {
  const list = document.getElementById('dialogueList');
  list.innerHTML = '';
  dialogue.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = 'dlg-item' + (i === 0 ? ' active' : '');
    div.id = 'dlg' + i;
    div.onclick = () => {
      document.querySelectorAll('.dlg-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active', 'done');
      speak(d.en); dlgDone.add(i);
      if (dlgDone.size >= dialogue.length) {
        const btn = document.getElementById('btn1');
        btn.className = 'btn btn-primary';
        btn.textContent = '太棒了！下一关 →';
      }
    };
    div.innerHTML = `<span class="dlg-who ${d.cls}">${d.who}</span><div><div class="dlg-text">${d.en}</div><div class="dlg-cn">${d.cn}</div></div><span class="dlg-play">▶️</span>`;
    list.appendChild(div);
  });
}

function renderVocab() {
  const grid = document.getElementById('vocabGrid');
  grid.innerHTML = '';
  vocab.forEach(v => {
    const div = document.createElement('div');
    div.className = 'vocab-card';
    div.onclick = () => { speak(v.en); document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('playing')); div.classList.add('playing'); setTimeout(() => div.classList.remove('playing'), 1200); };
    div.innerHTML = `<div class="vocab-emoji">${v.emoji}</div><div class="vocab-en">${v.en}</div><div class="vocab-cn">${v.cn}</div>`;
    grid.appendChild(div);
  });
}

function renderSorryProgress() {
  const wrap = document.getElementById('sorryProgress');
  wrap.innerHTML = '';
  for (let i = 0; i < sorryQuestions.length; i++) {
    const d = document.createElement('div'); d.className = 'sorry-dot'; d.id = 'sorrydot' + i; wrap.appendChild(d);
  }
}

function renderSorryQuestion() {
  if (sorryIndex >= sorryQuestions.length) {
    document.getElementById('btn3').className = 'btn btn-primary';
    document.getElementById('btn3').textContent = '进入下一关 →';
    document.getElementById('sorryScene').innerHTML = `<div style="font-size:52px;padding:16px">🎊</div><div style="font-family:'Fredoka One',cursive;font-size:20px;color:var(--correct)">全部答完！答对 ${sorryCorrect}/${sorryQuestions.length} 题</div>`;
    return;
  }
  const q = sorryQuestions[sorryIndex];
  document.getElementById('sorryScore').textContent = `第 ${sorryIndex + 1} 题 / 共 ${sorryQuestions.length} 题`;
  document.getElementById('sorryEmoji').textContent = q.emoji;
  document.getElementById('sorrySituation').textContent = q.situation;
  document.getElementById('sorryContext').textContent = q.context;
  document.getElementById('sorryRoleTag').innerHTML = `<span class="sorry-role-tag ${q.role}">${q.roleLabel}</span>`;

  const shuffled = [...q.options].sort(() => Math.random() - 0.5);
  const optsDiv = document.getElementById('sorryOptions');
  optsDiv.innerHTML = '';
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'sorry-opt'; btn.textContent = opt;
    btn.onclick = () => checkSorry(opt, btn);
    optsDiv.appendChild(btn);
  });
}

function checkSorry(answer, btn) {
  const q = sorryQuestions[sorryIndex];
  document.querySelectorAll('.sorry-opt').forEach(b => b.onclick = null);
  const isCorrect = answer === q.answer;
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) document.querySelectorAll('.sorry-opt').forEach(b => { if (b.textContent === q.answer) b.classList.add('correct'); });
  const scene = document.getElementById('sorryScene');
  scene.classList.add(isCorrect ? 'correct-anim' : 'wrong-anim');
  setTimeout(() => scene.classList.remove('correct-anim', 'wrong-anim'), 500);
  if (isCorrect) { sorryCorrect++; speak(q.answer); showToast('👍 正确！', 'green'); }
  else { showToast(`答案是 "${q.answer}"`, 'red'); }
  document.getElementById('sorrydot' + sorryIndex).classList.add(isCorrect ? 'correct' : 'wrong');
  sorryIndex++;
  setTimeout(renderSorryQuestion, 1400);
}

function renderFillQuestions() {
  const wrap = document.getElementById('fillQuestions');
  const dotsWrap = document.getElementById('fillDots');
  wrap.innerHTML = ''; dotsWrap.innerHTML = '';
  fillQuestions.forEach((q, i) => {
    const dot = document.createElement('div'); dot.className = 'fill-dot'; dot.id = 'filldot' + i; dotsWrap.appendChild(dot);
    const displaySent = q.sentence.replace(q.blank, `<span class="blank-word" id="fillblank${i}">${'_'.repeat(q.blank.length)}</span>`);
    const div = document.createElement('div');
    div.className = 'fill-question'; div.id = 'fillq' + i;
    div.innerHTML = `<div class="fill-sent">${displaySent}</div><div class="fill-cn">${q.cn}</div><div class="fill-options" id="fillopts${i}"></div>`;
    wrap.appendChild(div);
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'fill-opt'; btn.textContent = opt;
      btn.onclick = () => checkFill(i, opt, btn);
      div.querySelector(`#fillopts${i}`).appendChild(btn);
    });
  });
}

function checkFill(qi, answer, btn) {
  const q = fillQuestions[qi];
  document.querySelectorAll(`#fillopts${qi} .fill-opt`).forEach(b => b.onclick = null);
  const isCorrect = answer === q.answer;
  btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
  if (!isCorrect) document.querySelectorAll(`#fillopts${qi} .fill-opt`).forEach(b => { if (b.textContent === q.answer) b.classList.add('selected-correct'); });
  const blankEl = document.getElementById('fillblank' + qi);
  if (blankEl) { blankEl.textContent = q.answer; blankEl.style.borderStyle = 'solid'; blankEl.style.borderColor = isCorrect ? 'var(--correct)' : 'var(--wrong)'; }
  const qEl = document.getElementById('fillq' + qi);
  qEl.classList.add(isCorrect ? 'correct-anim' : 'wrong-anim');
  setTimeout(() => qEl.classList.remove('correct-anim', 'wrong-anim'), 500);
  document.getElementById('filldot' + qi).classList.add(isCorrect ? 'correct' : 'wrong');
  if (isCorrect) { speak(q.sentence.replace(q.blank, q.answer)); showToast('✅ 正确！', 'green'); }
  else showToast(`答案是 "${q.answer}"`, 'red');
  fillAnswered++;
  if (fillAnswered >= fillQuestions.length) { const b = document.getElementById('btn4'); b.className = 'btn btn-primary'; b.textContent = '完成本课 🎉'; }
}

function goStage(n) {
  document.getElementById('screen' + currentStage).classList.remove('active');
  document.getElementById('screen' + n).classList.add('active');
  ['dot0','dot1','dot2','dot3'].forEach((id, i) => {
    const el = document.getElementById(id);
    if (i < n-1) { el.classList.remove('active'); el.classList.add('done'); }
    else if (i === n-1) { el.classList.add('active'); el.classList.remove('done'); }
    else el.classList.remove('active','done');
  });
  currentStage = n; starsEarned = n - 1; updateStars(); updateProgress((n-1)/4*100); window.scrollTo(0,0);
}

function finishLesson() {
  starsEarned = 4; updateStars(); updateProgress(100); saveProgress(); renderFinish(); goStage(5); launchConfetti();
}

function renderFinish() {
  document.getElementById('finishStars').textContent = '⭐'.repeat(starsEarned) + '☆'.repeat(4-starsEarned);
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  dialogue.forEach(d => {
    const div = document.createElement('div'); div.className = 'review-line'; div.onclick = () => speak(d.en);
    div.innerHTML = `<span>${d.en}</span><span class="review-play">▶️</span>`; list.appendChild(div);
  });
}

function updateStars() {
  ['star1','star2','star3','star4'].forEach((id, i) => {
    const el = document.getElementById(id); const prev = el.textContent;
    el.textContent = i < starsEarned ? '⭐' : '☆';
    if (i < starsEarned && prev === '☆') { el.classList.add('earned'); setTimeout(() => el.classList.remove('earned'), 600); }
  });
}
function updateProgress(pct) { document.getElementById('progressBar').style.width = pct + '%'; }
function saveProgress() {
  try {
    const data = JSON.parse(localStorage.getItem('nce_progress') || '{}');
    const prev = data['3'];
    if (!prev || starsEarned > prev.stars) data['3'] = { stars: starsEarned, date: new Date().toISOString() };
    localStorage.setItem('nce_progress', JSON.stringify(data));
    const sd = JSON.parse(localStorage.getItem('nce_streak') || '{"days":0,"last":""}');
    const today = new Date().toDateString();
    if (sd.last !== today) { sd.days = sd.last === new Date(Date.now()-86400000).toDateString() ? sd.days+1 : 1; sd.last = today; }
    localStorage.setItem('nce_streak', JSON.stringify(sd));
  } catch(e) {}
}
function showToast(msg, type='') {
  const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}
function launchConfetti() {
  const wrap = document.getElementById('confettiWrap'); wrap.innerHTML = '';
  const colors = ['#AB47BC','#FF6F00','#00ACC1','#43A047','#EC407A','#1565C0','#FFD600'];
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div'); el.className = 'cf';
    el.style.left = Math.random()*100+'vw'; el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.5+Math.random()*2)+'s'; el.style.animationDelay = (Math.random()*0.8)+'s';
    el.style.width = el.style.height = (7+Math.random()*10)+'px'; wrap.appendChild(el);
  }
  setTimeout(() => wrap.innerHTML = '', 4000);
}
</script>
