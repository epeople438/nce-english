<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lesson 8 · Open your book</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2E7D32;
    --primary-dark: #1B5E20;
    --primary-light: #E8F5E9;
    --accent: #FF6F00;
    --accent2: #0288D1;
    --bg: #F1F8F1;
    --text: #0D2E0E;
    --correct: #43A047;
    --wrong: #E53935;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  .topbar {
    background: var(--primary); color: white;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(46,125,50,0.35);
  }
  .back-btn {
    background: rgba(255,255,255,0.2); border: none; color: white;
    border-radius: 50%; width: 36px; height: 36px; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    text-decoration: none; transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.3); }
  .topbar-title { font-family: 'Fredoka One', cursive; font-size: 17px; text-align: center; }
  .stars-bar { display: flex; gap: 4px; }
  .star { font-size: 20px; }
  .star.earned { animation: starPop 0.5s ease; }
  @keyframes starPop { 0%{transform:scale(1)} 50%{transform:scale(1.6) rotate(15deg)} 100%{transform:scale(1)} }

  .progress-wrap { height: 6px; background: #C8E6C9; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #66BB6A, #FF6F00); transition: width 0.5s ease; border-radius: 0 3px 3px 0; }

  .stage-dots { display: flex; justify-content: center; gap: 8px; padding: 14px 0 6px; }
  .stage-dot { width: 32px; height: 8px; border-radius: 4px; background: #C8E6C9; transition: background 0.3s, transform 0.2s; }
  .stage-dot.active { background: var(--primary); transform: scaleY(1.5); }
  .stage-dot.done { background: var(--accent); }

  .screen { display: none; animation: fadeIn 0.4s ease; padding: 12px 16px 40px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .card {
    background: white; border-radius: 20px; padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background: linear-gradient(90deg, #66BB6A, #0288D1, #FF6F00, #AB47BC, #FFB300);
  }
  .card-title { font-family: 'Fredoka One', cursive; font-size: 16px; color: var(--primary-dark); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

  /* PRACTICE BADGE */
  .practice-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, #FF6F00, #FFCA28); color: white;
    font-family: 'Fredoka One', cursive; font-size: 13px;
    padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
  }

  /* TEXT READER */
  .text-reader { background: #F1F8F1; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 2px solid #C8E6C9; }
  .text-line {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 8px; border-radius: 10px; cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .text-line:hover { background: var(--primary-light); }
  .text-line.active { background: var(--primary-light); transform: scale(1.01); }
  .line-num {
    font-family: 'Fredoka One', cursive; font-size: 12px; color: white;
    background: var(--primary); width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
  }
  .line-en { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.5; }
  .line-cn { font-size: 12px; color: #888; margin-top: 2px; }
  .play-btn { margin-left: auto; font-size: 18px; flex-shrink: 0; opacity: 0.4; transition: opacity 0.2s; }
  .text-line:hover .play-btn, .text-line.active .play-btn { opacity: 1; }
  .read-all-btn {
    width: 100%; padding: 12px; border: 2px dashed var(--primary); border-radius: 14px;
    background: transparent; font-family: 'Fredoka One', cursive; font-size: 15px;
    color: var(--primary); cursor: pointer; transition: background 0.2s; margin-top: 8px;
  }
  .read-all-btn:hover { background: var(--primary-light); }

  /* VOCAB */
  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vocab-card {
    background: var(--primary-light); border-radius: 14px; padding: 12px 14px;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent;
  }
  .vocab-card:active { transform: scale(0.96); }
  .vocab-card.playing { border-color: var(--primary); background: white; box-shadow: 0 4px 12px rgba(46,125,50,0.2); }
  .vocab-emoji { font-size: 28px; margin-bottom: 4px; }
  .vocab-en { font-family: 'Fredoka One', cursive; font-size: 15px; color: var(--primary-dark); }
  .vocab-cn { font-size: 12px; color: #666; margin-top: 2px; }

  /* IMPERATIVE GAME — Command Simon Says */
  .simon-scene { text-align: center; }
  .simon-teacher {
    font-size: 64px; margin-bottom: 6px; display: inline-block;
    animation: teacherBob 2s ease-in-out infinite;
  }
  @keyframes teacherBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .simon-says-label {
    font-family: 'Fredoka One', cursive; font-size: 13px;
    background: var(--primary); color: white; display: inline-block;
    padding: 3px 14px; border-radius: 20px; margin-bottom: 10px;
  }
  .simon-command {
    background: var(--primary-light); border: 2px solid var(--primary);
    border-radius: 18px; padding: 14px 16px; margin-bottom: 14px;
    font-family: 'Fredoka One', cursive; font-size: 20px; color: var(--primary-dark);
    transition: border-color 0.3s;
  }
  .simon-command.correct-anim { border-color: var(--correct); animation: correctPop 0.4s ease; }
  .simon-command.wrong-anim { border-color: var(--wrong); animation: shake 0.4s ease; }
  @keyframes correctPop { 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
  .simon-cmd-cn { font-size: 13px; color: #888; margin-top: 4px; font-family: 'Nunito', sans-serif; font-weight: 600; }
  .simon-blank {
    display: inline-block; min-width: 80px; border-bottom: 3px solid var(--primary);
    color: var(--primary); font-size: 20px; line-height: 1.4; transition: all 0.3s; text-align: center;
  }
  .simon-blank.filled { background: var(--primary-light); border-radius: 8px; border: 2px solid var(--primary); padding: 0 8px; }
  .simon-options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px;
  }
  .simon-opt {
    padding: 13px 8px; border-radius: 14px; border: 2px solid #C8E6C9;
    background: white; font-family: 'Fredoka One', cursive; font-size: 16px;
    cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.3;
  }
  .simon-opt:hover { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }
  .simon-opt:active { transform: scale(0.95); }
  .simon-opt.correct { background: #E8F5E9; border-color: var(--correct); color: var(--correct); }
  .simon-opt.wrong { background: #FFEBEE; border-color: var(--wrong); color: var(--wrong); }
  .simon-progress { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
  .simon-dot { width: 10px; height: 10px; border-radius: 50%; background: #C8E6C9; transition: background 0.3s; }
  .simon-dot.correct { background: var(--correct); }
  .simon-dot.wrong { background: var(--wrong); }
  .simon-score { text-align: center; font-family: 'Fredoka One', cursive; font-size: 14px; color: #888; margin-bottom: 10px; }
  .rule-box {
    background: #FFF8E1; border: 2px solid #FFB300; border-radius: 14px;
    padding: 10px 14px; margin-bottom: 14px; font-size: 13px; font-weight: 700;
    color: #5D4037; text-align: center; line-height: 1.8;
  }
  .rule-tag { display: inline-block; background: white; border-radius: 8px; padding: 1px 8px; margin: 1px 3px; }

  /* FILL */
  .fill-question {
    background: white; border: 2px solid #C8E6C9; border-radius: 18px;
    padding: 16px; margin-bottom: 12px; transition: border-color 0.3s;
  }
  .fill-question.correct-anim { border-color: var(--correct); animation: correctPop 0.4s ease; }
  .fill-question.wrong-anim { border-color: var(--wrong); animation: shake 0.4s ease; }
  .fill-sent { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 10px; line-height: 1.5; }
  .fill-sent .blank-word { display: inline-block; min-width: 70px; text-align: center; border-bottom: 2px dashed var(--primary); color: var(--primary); font-style: italic; }
  .fill-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .fill-opt {
    padding: 7px 16px; border-radius: 50px; border: 2px solid #C8E6C9;
    background: white; font-family: 'Fredoka One', cursive; font-size: 15px; cursor: pointer; transition: all 0.2s;
  }
  .fill-opt:hover { border-color: var(--primary); background: var(--primary-light); }
  .fill-opt.selected-correct { background: #E8F5E9; border-color: var(--correct); color: var(--correct); }
  .fill-opt.selected-wrong { background: #FFEBEE; border-color: var(--wrong); color: var(--wrong); }
  .fill-cn { font-size: 13px; color: #999; margin-top: 6px; }
  .fill-score-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .fill-dot { width: 10px; height: 10px; border-radius: 50%; background: #C8E6C9; transition: background 0.3s; }
  .fill-dot.correct { background: var(--correct); }
  .fill-dot.wrong { background: var(--wrong); }

  .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-family: 'Fredoka One', cursive; font-size: 18px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; margin-top: 8px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(46,125,50,0.35); }
  .btn-primary:hover { box-shadow: 0 6px 18px rgba(46,125,50,0.45); }
  .btn-disabled { background: #B0BEC5; color: white; cursor: not-allowed; box-shadow: none; }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: #333; color: white; padding: 12px 24px; border-radius: 50px; font-size: 15px; font-weight: 700; z-index: 999; transition: transform 0.3s ease; white-space: nowrap; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.green { background: var(--correct); }
  .toast.red { background: var(--wrong); }

  .confetti-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 998; }
  .cf { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: cfFall linear forwards; }
  @keyframes cfFall { 0%{top:-20px;transform:rotate(0deg) scale(1);opacity:1} 80%{opacity:1} 100%{top:110vh;transform:rotate(720deg) scale(0.5);opacity:0} }

  .finish-card { text-align: center; padding: 30px 20px; }
  .finish-emoji { font-size: 64px; margin-bottom: 12px; }
  .finish-title { font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--primary-dark); margin-bottom: 8px; }
  .finish-stars { font-size: 36px; letter-spacing: 4px; margin-bottom: 16px; }
  .finish-review { background: var(--primary-light); border-radius: 16px; padding: 16px; text-align: left; margin-top: 16px; }
  .finish-review-title { font-family: 'Fredoka One', cursive; color: var(--primary); font-size: 15px; margin-bottom: 10px; }
  .review-line { font-size: 14px; font-weight: 700; color: var(--text); padding: 6px 0; border-bottom: 1px solid #C8E6C9; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .review-line:last-child { border-bottom: none; }
  .review-play { color: var(--primary); }
</style>
</head>
<body>

<div class="topbar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="topbar-title">Lesson 8 · Open your book 📚</div>
  <div class="stars-bar">
    <span class="star" id="star1">☆</span>
    <span class="star" id="star2">☆</span>
    <span class="star" id="star3">☆</span>
    <span class="star" id="star4">☆</span>
  </div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="stage-dots">
  <div class="stage-dot active" id="dot0"></div>
  <div class="stage-dot" id="dot1"></div>
  <div class="stage-dot" id="dot2"></div>
  <div class="stage-dot" id="dot3"></div>
</div>

<!-- SCREEN 1: READ TEXT -->
<div class="screen active" id="screen1">
  <div class="card">
    <div class="practice-badge">📝 练习课</div>
    <div class="card-title">📖 第一关：读课文</div>
    <div style="font-size:13px;color:#888;margin-bottom:12px;">点击每一行，听发音并跟读 🔊</div>
    <div class="text-reader" id="textReader"></div>
    <button class="read-all-btn" onclick="readAll()">▶️ 连续朗读全文</button>
  </div>
  <button class="btn btn-primary" onclick="goStage(2)">去认单词 →</button>
</div>

<!-- SCREEN 2: VOCAB -->
<div class="screen" id="screen2">
  <div class="card">
    <div class="card-title">📖 第二关：认单词</div>
    <div style="text-align:center;font-size:13px;color:#888;margin-bottom:14px;">点击卡片，听发音 🔊</div>
    <div class="vocab-grid" id="vocabGrid"></div>
  </div>
  <button class="btn btn-primary" onclick="goStage(3)">下一关 →</button>
</div>

<!-- SCREEN 3: SIMON SAYS GAME -->
<div class="screen" id="screen3">
  <div class="card">
    <div class="card-title">🎮 第三关：老师说 Simon Says!</div>
    <div class="rule-box">
      📌 祈使句 = 直接用动词开头，没有主语！<br>
      <span class="rule-tag">Open your book.</span>
      <span class="rule-tag">Close the door.</span>
      <span class="rule-tag">Stand up!</span>
    </div>
    <div class="simon-progress" id="simonProgress"></div>
    <div class="simon-score" id="simonScore">第 1 题 / 共 8 题</div>
    <div class="simon-scene">
      <div class="simon-teacher">👩‍🏫</div>
      <div class="simon-says-label">老师说：</div>
      <div class="simon-command" id="simonCommand">
        <span id="simonPartial"></span>
        <span class="simon-blank" id="simonBlank">___</span>
        <span id="simonEnd"></span>
        <div class="simon-cmd-cn" id="simonCn"></div>
      </div>
      <div class="simon-options" id="simonOptions"></div>
    </div>
  </div>
  <button class="btn btn-disabled" id="btn3" onclick="goStage(4)">完成全部题目 🔒</button>
</div>

<!-- SCREEN 4: FILL -->
<div class="screen" id="screen4">
  <div class="card">
    <div class="card-title">✏️ 第四关：填一填</div>
    <div class="fill-score-row" id="fillDots"></div>
    <div id="fillQuestions"></div>
  </div>
  <button class="btn btn-disabled" id="btn4" onclick="finishLesson()">完成全部题目 🔒</button>
</div>

<!-- SCREEN 5: FINISH -->
<div class="screen" id="screen5">
  <div class="card finish-card">
    <div class="finish-emoji">🌟</div>
    <div class="finish-title">棒极了！</div>
    <div class="finish-stars" id="finishStars"></div>
    <div style="font-size:15px;color:#666;margin-bottom:8px;">第8课完成！<br>你学会了 <b>祈使句</b> — 直接下达指令！ 📢</div>
    <div class="finish-review">
      <div class="finish-review-title">📖 复习课文</div>
      <div id="reviewList"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:20px;" onclick="location.href='lesson9.html'">去第9课 →</button>
    <button class="btn" style="background:#E8F5E9;color:var(--primary-dark);margin-top:8px;" onclick="location.href='../index.html'">回主页 🏠</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="confetti-wrap" id="confettiWrap"></div>

<script>
const textLines = [
  { en: 'Open your book.', cn: '打开你的书。' },
  { en: 'Read page twelve.', cn: '读第十二页。' },
  { en: 'Close your book.', cn: '合上你的书。' },
  { en: 'What is your name?', cn: '你叫什么名字？' },
  { en: 'My name is Robert Hill.', cn: '我的名字是罗伯特·希尔。' },
  { en: 'What is your job?', cn: '你是做什么工作的？' },
  { en: 'Are you a teacher?', cn: '你是老师吗？' },
  { en: 'No, I am not. I am a policeman.', cn: '不，我不是。我是警察。' },
];

const vocab = [
  { emoji: '📖', en: 'open', cn: '打开' },
  { emoji: '📕', en: 'close', cn: '关上/合上' },
  { emoji: '📄', en: 'read', cn: '读/阅读' },
  { emoji: '🔢', en: 'page', cn: '页' },
  { emoji: '💼', en: 'job', cn: '工作/职业' },
  { emoji: '👮', en: 'policeman', cn: '警察' },
  { emoji: '⬆️', en: 'stand up', cn: '站起来' },
  { emoji: '⬇️', en: 'sit down', cn: '坐下' },
];

const simonQuestions = [
  { partial: '', blank: 'Open', end: ' your book.', cn: '（打开你的书）', options: ['Open', 'Close', 'Read', 'Write'], answer: 'Open', full: 'Open your book.' },
  { partial: 'Read page ', blank: 'twelve', end: '.', cn: '（读第十二页）', options: ['twelve', 'ten', 'two', 'twenty'], answer: 'twelve', full: 'Read page twelve.' },
  { partial: '', blank: 'Close', end: ' your book.', cn: '（合上你的书）', options: ['Open', 'Close', 'Put', 'Take'], answer: 'Close', full: 'Close your book.' },
  { partial: '', blank: 'Stand up', end: ', please!', cn: '（请站起来！）', options: ['Stand up', 'Sit down', 'Come in', 'Go out'], answer: 'Stand up', full: 'Stand up, please!' },
  { partial: '', blank: 'Sit down', end: ', please.', cn: '（请坐下）', options: ['Stand up', 'Sit down', 'Look up', 'Lie down'], answer: 'Sit down', full: 'Sit down, please.' },
  { partial: '', blank: 'Look', end: ' at the board.', cn: '（看黑板）', options: ['Look', 'Read', 'Write', 'Open'], answer: 'Look', full: 'Look at the board.' },
  { partial: '', blank: 'Write', end: ' your name.', cn: '（写下你的名字）', options: ['Write', 'Read', 'Say', 'Open'], answer: 'Write', full: 'Write your name.' },
  { partial: 'Come ', blank: 'in', end: '!', cn: '（进来！）', options: ['in', 'out', 'up', 'down'], answer: 'in', full: 'Come in!' },
];

const fillQuestions = [
  { sentence: '___ your book.', blank: 'Open', options: ['Open', 'Close', 'Read', 'Write'], answer: 'Open', cn: '打开你的书。' },
  { sentence: 'Read ___ twelve.', blank: 'page', options: ['page', 'number', 'chapter', 'lesson'], answer: 'page', cn: '读第十二页。' },
  { sentence: 'What is your ___?', blank: 'job', options: ['job', 'name', 'book', 'car'], answer: 'job', cn: '你是做什么工作的？' },
  { sentence: 'No, I am ___. I am a policeman.', blank: 'not', options: ['not', 'no', "isn't", "don't"], answer: 'not', cn: '不，我不是。我是警察。' },
  { sentence: '___ up, please!', blank: 'Stand', options: ['Stand', 'Sit', 'Come', 'Go'], answer: 'Stand', cn: '请站起来！' },
  { sentence: 'Come ___, please.', blank: 'in', options: ['in', 'out', 'up', 'down'], answer: 'in', cn: '请进。' },
];

let currentStage = 1, starsEarned = 0;
let simonIndex = 0, simonCorrect = 0;
let fillAnswered = 0;
let readAllTimer = null;

window.onload = () => {
  renderTextReader(); renderVocab(); renderSimonProgress(); renderSimonQuestion(); renderFillQuestions(); updateProgress(0);
};

function speak(text, rate=0.88) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate;
  const voices = window.speechSynthesis.getVoices();
  for (const p of ['Samantha','Google US English','Daniel','Karen']) {
    const v = voices.find(v => v.name.includes(p));
    if (v) { u.voice = v; break; }
  }
  window.speechSynthesis.speak(u);
}

function renderTextReader() {
  const wrap = document.getElementById('textReader');
  wrap.innerHTML = '';
  textLines.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'text-line';
    div.id = 'tl' + i;
    div.onclick = () => {
      document.querySelectorAll('.text-line').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      speak(line.en);
      setTimeout(() => div.classList.remove('active'), 2500);
    };
    div.innerHTML = `<span class="line-num">${i+1}</span><div><div class="line-en">${line.en}</div><div class="line-cn">${line.cn}</div></div><span class="play-btn">▶️</span>`;
    wrap.appendChild(div);
  });
}

function readAll() {
  if (readAllTimer) clearTimeout(readAllTimer);
  let delay = 0;
  textLines.forEach((line, i) => {
    readAllTimer = setTimeout(() => {
      document.querySelectorAll('.text-line').forEach(el => el.classList.remove('active'));
      document.getElementById('tl' + i).classList.add('active');
      speak(line.en);
      setTimeout(() => { const el = document.getElementById('tl' + i); if (el) el.classList.remove('active'); }, 2200);
    }, delay);
    delay += 2400;
  });
}

function renderVocab() {
  const grid = document.getElementById('vocabGrid');
  grid.innerHTML = '';
  vocab.forEach(v => {
    const div = document.createElement('div');
    div.className = 'vocab-card';
    div.onclick = () => {
      speak(v.en);
      document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('playing'));
      div.classList.add('playing');
      setTimeout(() => div.classList.remove('playing'), 1200);
    };
    div.innerHTML = `<div class="vocab-emoji">${v.emoji}</div><div class="vocab-en">${v.en}</div><div class="vocab-cn">${v.cn}</div>`;
    grid.appendChild(div);
  });
}

function renderSimonProgress() {
  const wrap = document.getElementById('simonProgress');
  wrap.innerHTML = '';
  for (let i = 0; i < simonQuestions.length; i++) {
    const d = document.createElement('div');
    d.className = 'simon-dot'; d.id = 'simondot' + i;
    wrap.appendChild(d);
  }
}

function renderSimonQuestion() {
  if (simonIndex >= simonQuestions.length) {
    document.getElementById('btn3').className = 'btn btn-primary';
    document.getElementById('btn3').textContent = '进入下一关 →';
    document.querySelector('#screen3 .simon-scene').innerHTML = `<div style="font-size:56px;padding:20px">🎉</div><div style="font-family:'Fredoka One',cursive;font-size:20px;color:var(--correct);text-align:center">全部答完！答对 ${simonCorrect}/${simonQuestions.length} 题</div>`;
    return;
  }
  const q = simonQuestions[simonIndex];
  document.getElementById('simonScore').textContent = `第 ${simonIndex + 1} 题 / 共 ${simonQuestions.length} 题`;
  document.getElementById('simonPartial').textContent = q.partial;
  document.getElementById('simonBlank').textContent = '___';
  document.getElementById('simonBlank').className = 'simon-blank';
  document.getElementById('simonEnd').textContent = q.end;
  document.getElementById('simonCn').textContent = q.cn;

  const shuffled = [...q.options].sort(() => Math.random() - 0.5);
  const optsDiv = document.getElementById('simonOptions');
  optsDiv.innerHTML = '';
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'simon-opt';
    btn.textContent = opt;
    btn.onclick = () => checkSimon(opt, btn);
    optsDiv.appendChild(btn);
  });
}

function checkSimon(answer, btn) {
  const q = simonQuestions[simonIndex];
  document.querySelectorAll('.simon-opt').forEach(b => b.onclick = null);
  const isCorrect = answer === q.answer;
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) document.querySelectorAll('.simon-opt').forEach(b => { if (b.textContent === q.answer) b.classList.add('correct'); });

  const blank = document.getElementById('simonBlank');
  blank.textContent = q.answer; blank.classList.add('filled');

  const cmd = document.getElementById('simonCommand');
  cmd.classList.add(isCorrect ? 'correct-anim' : 'wrong-anim');
  setTimeout(() => cmd.classList.remove('correct-anim', 'wrong-anim'), 500);

  if (isCorrect) {
    simonCorrect++;
    speak(q.full);
    showToast('👍 正确！', 'green');
  } else {
    showToast(`答案是 "${q.answer}"`, 'red');
  }
  document.getElementById('simondot' + simonIndex).classList.add(isCorrect ? 'correct' : 'wrong');
  simonIndex++;
  setTimeout(renderSimonQuestion, 1400);
}

function renderFillQuestions() {
  const wrap = document.getElementById('fillQuestions');
  const dotsWrap = document.getElementById('fillDots');
  wrap.innerHTML = ''; dotsWrap.innerHTML = '';
  fillQuestions.forEach((q, i) => {
    const dot = document.createElement('div');
    dot.className = 'fill-dot'; dot.id = 'filldot' + i;
    dotsWrap.appendChild(dot);
    const displaySent = q.sentence.replace(q.blank, `<span class="blank-word" id="fillblank${i}">${'_'.repeat(q.blank.length)}</span>`);
    const div = document.createElement('div');
    div.className = 'fill-question'; div.id = 'fillq' + i;
    div.innerHTML = `<div class="fill-sent">${displaySent}</div><div class="fill-cn">${q.cn}</div><div class="fill-options" id="fillopts${i}"></div>`;
    wrap.appendChild(div);
    const optsDiv = div.querySelector(`#fillopts${i}`);
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'fill-opt'; btn.textContent = opt;
      btn.onclick = () => checkFill(i, opt, btn);
      optsDiv.appendChild(btn);
    });
  });
}

function checkFill(qi, answer, btn) {
  const q = fillQuestions[qi];
  document.querySelectorAll(`#fillopts${qi} .fill-opt`).forEach(b => b.onclick = null);
  const isCorrect = answer === q.answer;
  btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
  if (!isCorrect) document.querySelectorAll(`#fillopts${qi} .fill-opt`).forEach(b => { if (b.textContent === q.answer) b.classList.add('selected-correct'); });
  const blankEl = document.getElementById('fillblank' + qi);
  if (blankEl) { blankEl.textContent = q.answer; blankEl.style.borderStyle = 'solid'; blankEl.style.borderColor = isCorrect ? 'var(--correct)' : 'var(--wrong)'; }
  const qEl = document.getElementById('fillq' + qi);
  qEl.classList.add(isCorrect ? 'correct-anim' : 'wrong-anim');
  setTimeout(() => qEl.classList.remove('correct-anim', 'wrong-anim'), 500);
  document.getElementById('filldot' + qi).classList.add(isCorrect ? 'correct' : 'wrong');
  if (isCorrect) { speak(q.sentence.replace(q.blank, q.answer)); showToast('✅ 正确！', 'green'); }
  else showToast(`答案是 "${q.answer}"`, 'red');
  fillAnswered++;
  if (fillAnswered >= fillQuestions.length) {
    const btn4 = document.getElementById('btn4');
    btn4.className = 'btn btn-primary';
    btn4.textContent = '完成本课 🎉';
  }
}

function goStage(n) {
  document.getElementById('screen' + currentStage).classList.remove('active');
  document.getElementById('screen' + n).classList.add('active');
  ['dot0','dot1','dot2','dot3'].forEach((id, i) => {
    const el = document.getElementById(id);
    if (i < n-1) { el.classList.remove('active'); el.classList.add('done'); }
    else if (i === n-1) { el.classList.add('active'); el.classList.remove('done'); }
    else el.classList.remove('active','done');
  });
  currentStage = n; starsEarned = n - 1;
  updateStars(); updateProgress((n-1)/4*100);
  window.scrollTo(0,0);
}

function finishLesson() {
  starsEarned = 4; updateStars(); updateProgress(100); saveProgress(); renderFinish();
  goStage(5); launchConfetti();
}

function renderFinish() {
  document.getElementById('finishStars').textContent = '⭐'.repeat(starsEarned) + '☆'.repeat(4-starsEarned);
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  textLines.forEach(line => {
    const div = document.createElement('div');
    div.className = 'review-line';
    div.onclick = () => speak(line.en);
    div.innerHTML = `<span>${line.en}</span><span class="review-play">▶️</span>`;
    list.appendChild(div);
  });
}

function updateStars() {
  ['star1','star2','star3','star4'].forEach((id, i) => {
    const el = document.getElementById(id);
    const prev = el.textContent;
    el.textContent = i < starsEarned ? '⭐' : '☆';
    if (i < starsEarned && prev === '☆') { el.classList.add('earned'); setTimeout(() => el.classList.remove('earned'), 600); }
  });
}

function updateProgress(pct) { document.getElementById('progressBar').style.width = pct + '%'; }

function saveProgress() {
  try {
    const data = JSON.parse(localStorage.getItem('nce_progress') || '{}');
    const prev = data['8'];
    if (!prev || starsEarned > prev.stars) data['8'] = { stars: starsEarned, date: new Date().toISOString() };
    localStorage.setItem('nce_progress', JSON.stringify(data));
    const sd = JSON.parse(localStorage.getItem('nce_streak') || '{"days":0,"last":""}');
    const today = new Date().toDateString();
    if (sd.last !== today) { sd.days = sd.last === new Date(Date.now()-86400000).toDateString() ? sd.days+1 : 1; sd.last = today; }
    localStorage.setItem('nce_streak', JSON.stringify(sd));
  } catch(e) {}
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function launchConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#66BB6A','#FF6F00','#0288D1','#AB47BC','#FFB300','#EC407A','#1565C0'];
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'cf';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.5+Math.random()*2)+'s';
    el.style.animationDelay = (Math.random()*0.8)+'s';
    el.style.width = el.style.height = (7+Math.random()*10)+'px';
    wrap.appendChild(el);
  }
  setTimeout(() => wrap.innerHTML = '', 4000);
}
</script>
