<script>
// ★ 真实课文原文（新概念第一册 Lesson 12）
// 课文形式：一问一答，练习 Whose is this/that + his/her 物主代词
const textLines = [
  { q: 'Whose is this shirt?',      qCn: '这件衬衫是谁的？',      a: "It's Tim's. It's his shirt.",      aCn: '是蒂姆的，这是他的衬衫。' },
  { q: 'Whose is this handbag?',    qCn: '这个手提包是谁的？',    a: "It's Stella's. It's her handbag.", aCn: '是斯特拉的，这是她的手提包。' },
  { q: 'Whose is this coat?',       qCn: '这件大衣是谁的？',      a: "It's Tony's. It's his coat.",      aCn: '是托尼的，这是他的大衣。' },
  { q: 'Whose is this blouse?',     qCn: '这件女上衣是谁的？',    a: "It's Luming's. It's her blouse.",  aCn: '是路明的，这是她的上衣。' },
  { q: 'Whose is this pencil?',     qCn: '这支铅笔是谁的？',      a: "It's Hans's. It's his pencil.",    aCn: '是汉斯的，这是他的铅笔。' },
  { q: 'Whose is this tie?',        qCn: '这条领带是谁的？',      a: "It's Dave's. It's his tie.",       aCn: '是戴夫的，这是他的领带。' },
];

const vocab = [
  { emoji: '👔', en: 'tie', cn: '领带' },
  { emoji: '👕', en: 'blouse', cn: '（女式）短上衣' },
  { emoji: '👨', en: 'father', cn: '父亲' },
  { emoji: '👩', en: 'mother', cn: '母亲' },
  { emoji: '👦', en: 'brother', cn: '兄弟' },
  { emoji: '👧', en: 'sister', cn: '姐妹' },
  { emoji: '👦', en: 'his', cn: '他的（物主代词）' },
  { emoji: '👧', en: 'her', cn: '她的（物主代词）' },
];

// his/her 10道题：看人物性别和物品，选对物主代词
const hisherQuestions = [
  { personEmoji:'👦', personName:'Tim（男）',   itemEmoji:'👕', itemName:'衬衫', itemWord:'shirt',   answer:'his' },
  { personEmoji:'👩', personName:'Stella（女）', itemEmoji:'👜', itemName:'手提包', itemWord:'handbag', answer:'her' },
  { personEmoji:'👨', personName:'Tony（男）',   itemEmoji:'🧥', itemName:'大衣', itemWord:'coat',    answer:'his' },
  { personEmoji:'👩', personName:'Luming（女）', itemEmoji:'👚', itemName:'女上衣', itemWord:'blouse',  answer:'her' },
  { personEmoji:'👦', personName:'Hans（男）',   itemEmoji:'✏️', itemName:'铅笔', itemWord:'pencil',  answer:'his' },
  { personEmoji:'👨', personName:'Dave（男）',   itemEmoji:'👔', itemName:'领带', itemWord:'tie',     answer:'his' },
  { personEmoji:'👩', personName:'Sophie（女）', itemEmoji:'📗', itemName:'书',   itemWord:'book',    answer:'her' },
  { personEmoji:'👦', personName:'Robert（男）', itemEmoji:'⌨️', itemName:'键盘', itemWord:'keyboard', answer:'his' },
  { personEmoji:'👩', personName:'Helen（女）',  itemEmoji:'☂️', itemName:'雨伞', itemWord:'umbrella', answer:'her' },
  { personEmoji:'👨', personName:'Steven（男）', itemEmoji:'👓', itemName:'眼镜', itemWord:'glasses',  answer:'his' },
];

const fillQuestions = [
  { sentence: "Whose is this shirt? It's Tim's. It's ___ shirt.", blank:'his', options:['his','her','its','my'], answer:'his', cn:"这件衬衫是谁的？是蒂姆的，这是他的衬衫。" },
  { sentence: "Whose is this handbag? It's Stella's. It's ___ handbag.", blank:'her', options:['his','her','your','their'], answer:'her', cn:"这个手提包是谁的？是斯特拉的，这是她的手提包。" },
  { sentence: "Whose is this pencil? It's Hans's. It's ___ pencil.", blank:'his', options:['her','his','my','your'], answer:'his', cn:"这支铅笔是谁的？是汉斯的，这是他的铅笔。" },
  { sentence: "Whose is ___ coat?", blank:'this', options:['this','that','whose','him'], answer:'this', cn:"这件大衣是谁的？" },
  { sentence: "It's Tony's. It's ___ coat.", blank:'his', options:['his','her','your','our'], answer:'his', cn:"是托尼的，这是他的大衣。" },
  { sentence: "Whose is this ___?", blank:'tie', options:['tie','shirt','blouse','pencil'], answer:'tie', cn:"这条领带是谁的？" },
];

let currentStage=1, starsEarned=0, hisherIndex=0, hisherCorrect=0, fillAnswered=0;
let readAllTimer=null;

window.onload=()=>{ renderTextReader(); renderVocab(); renderHisherProgress(); renderHisherQuestion(); renderFillQuestions(); updateProgress(0); };

function speak(text,rate=0.88){ if(!('speechSynthesis' in window))return; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate; const voices=window.speechSynthesis.getVoices(); for(const p of ['Samantha','Google US English','Daniel','Karen']){const v=voices.find(v=>v.name.includes(p));if(v){u.voice=v;break;}} window.speechSynthesis.speak(u); }

function renderTextReader(){
  const wrap=document.getElementById('textReader'); wrap.innerHTML='';
  let lineNum=1;
  textLines.forEach((pair,i)=>{
    const pairDiv=document.createElement('div'); pairDiv.className='text-pair';
    // Q line
    const qDiv=document.createElement('div'); qDiv.className='text-line q-line'; qDiv.id='tl'+(i*2);
    qDiv.onclick=()=>{ document.querySelectorAll('.text-line').forEach(el=>el.classList.remove('active')); qDiv.classList.add('active'); speak(pair.q); setTimeout(()=>qDiv.classList.remove('active'),2500); };
    qDiv.innerHTML=`<span class="line-num">${lineNum++}</span><div><div class="line-en">${pair.q}</div><div class="line-cn">${pair.qCn}</div></div><span class="play-btn">▶️</span>`;
    // A line
    const aDiv=document.createElement('div'); aDiv.className='text-line a-line'; aDiv.id='tl'+(i*2+1);
    aDiv.onclick=()=>{ document.querySelectorAll('.text-line').forEach(el=>el.classList.remove('active')); aDiv.classList.add('active'); speak(pair.a); setTimeout(()=>aDiv.classList.remove('active'),3000); };
    aDiv.innerHTML=`<span class="line-num ans">${lineNum++}</span><div><div class="line-en">${pair.a}</div><div class="line-cn">${pair.aCn}</div></div><span class="play-btn">▶️</span>`;
    pairDiv.appendChild(qDiv); pairDiv.appendChild(aDiv); wrap.appendChild(pairDiv);
  });
}

function readAll(){
  if(readAllTimer) clearTimeout(readAllTimer); let delay=0;
  const allLines=[];
  textLines.forEach(pair=>{ allLines.push({en:pair.q,id:null}); allLines.push({en:pair.a,id:null}); });
  document.querySelectorAll('.text-line').forEach((el,i)=>{ if(allLines[i]) allLines[i].el=el; });
  allLines.forEach((line,i)=>{
    readAllTimer=setTimeout(()=>{ document.querySelectorAll('.text-line').forEach(el=>el.classList.remove('active')); if(line.el)line.el.classList.add('active'); speak(line.en); setTimeout(()=>{if(line.el)line.el.classList.remove('active');},i%2===0?2200:3000); },delay);
    delay+=i%2===0?2400:3200;
  });
}

function renderVocab(){ const grid=document.getElementById('vocabGrid'); grid.innerHTML=''; vocab.forEach(v=>{ const div=document.createElement('div'); div.className='vocab-card'; div.onclick=()=>{ speak(v.en); document.querySelectorAll('.vocab-card').forEach(c=>c.classList.remove('playing')); div.classList.add('playing'); setTimeout(()=>div.classList.remove('playing'),1200); }; div.innerHTML=`<div class="vocab-emoji">${v.emoji}</div><div class="vocab-en">${v.en}</div><div class="vocab-cn">${v.cn}</div>`; grid.appendChild(div); }); }

function renderHisherProgress(){ const wrap=document.getElementById('hisherProgress'); wrap.innerHTML=''; for(let i=0;i<hisherQuestions.length;i++){const d=document.createElement('div');d.className='hisher-dot';d.id='hisherdot'+i;wrap.appendChild(d);} }

function renderHisherQuestion(){
  if(hisherIndex>=hisherQuestions.length){
    document.getElementById('btn3').className='btn btn-primary'; document.getElementById('btn3').textContent='进入下一关 →';
    document.getElementById('hisherQ').innerHTML=`<div style="font-size:52px;padding:16px;text-align:center">🎊</div><div style="font-family:'Fredoka One',cursive;font-size:20px;color:var(--correct);text-align:center">全部答完！答对 ${hisherCorrect}/${hisherQuestions.length} 题</div>`; return;
  }
  const q=hisherQuestions[hisherIndex];
  document.getElementById('hisherScore').textContent=`第 ${hisherIndex+1} 题 / 共 ${hisherQuestions.length} 题`;
  document.getElementById('hisherPersonEmoji').textContent=q.personEmoji;
  document.getElementById('hisherPersonName').textContent=q.personName;
  document.getElementById('hisherItemEmoji').textContent=q.itemEmoji;
  document.getElementById('hisherItemName').textContent=q.itemName;
  document.getElementById('hisherQuestion').textContent=`Whose is this ${q.itemWord}?`;
  document.getElementById('hisherBlank').textContent='___'; document.getElementById('hisherBlank').className='hisher-blank';
  document.getElementById('hisherItemWord').textContent=q.itemWord+'.';
  document.querySelectorAll('.hisher-btn').forEach(b=>{ b.classList.remove('correct','wrong'); b.onclick=()=>checkHisher(b.textContent); });
}

function checkHisher(answer){
  const q=hisherQuestions[hisherIndex]; document.querySelectorAll('.hisher-btn').forEach(b=>b.onclick=null);
  const isCorrect=answer===q.answer;
  document.querySelectorAll('.hisher-btn').forEach(b=>{ if(b.textContent===q.answer)b.classList.add('correct'); else if(b.textContent===answer&&!isCorrect)b.classList.add('wrong'); });
  document.getElementById('hisherBlank').textContent=q.answer; document.getElementById('hisherBlank').classList.add('filled');
  const qEl=document.getElementById('hisherQ'); qEl.classList.add(isCorrect?'correct-anim':'wrong-anim'); setTimeout(()=>qEl.classList.remove('correct-anim','wrong-anim'),500);
  if(isCorrect){ hisherCorrect++; speak(`It's ${q.answer} ${q.itemWord}.`); showToast('👍 正确！','green'); }
  else showToast(`答案是 "${q.answer}"`,'red');
  document.getElementById('hisherdot'+hisherIndex).classList.add(isCorrect?'correct':'wrong'); hisherIndex++; setTimeout(renderHisherQuestion,1300);
}

function renderFillQuestions(){
  const wrap=document.getElementById('fillQuestions'); const dotsWrap=document.getElementById('fillDots'); wrap.innerHTML=''; dotsWrap.innerHTML='';
  fillQuestions.forEach((q,i)=>{ const dot=document.createElement('div'); dot.className='fill-dot'; dot.id='filldot'+i; dotsWrap.appendChild(dot);
    const displaySent=q.sentence.replace(q.blank,`<span class="blank-word" id="fillblank${i}">${'_'.repeat(q.blank.length)}</span>`);
    const div=document.createElement('div'); div.className='fill-question'; div.id='fillq'+i;
    div.innerHTML=`<div class="fill-sent">${displaySent}</div><div class="fill-cn">${q.cn}</div><div class="fill-options" id="fillopts${i}"></div>`; wrap.appendChild(div);
    q.options.forEach(opt=>{ const btn=document.createElement('button'); btn.className='fill-opt'; btn.textContent=opt; btn.onclick=()=>checkFill(i,opt,btn); div.querySelector(`#fillopts${i}`).appendChild(btn); }); });
}

function checkFill(qi,answer,btn){
  const q=fillQuestions[qi]; document.querySelectorAll(`#fillopts${qi} .fill-opt`).forEach(b=>b.onclick=null);
  const isCorrect=answer===q.answer; btn.classList.add(isCorrect?'selected-correct':'selected-wrong');
  if(!isCorrect) document.querySelectorAll(`#fillopts${qi} .fill-opt`).forEach(b=>{if(b.textContent===q.answer)b.classList.add('selected-correct');});
  const blankEl=document.getElementById('fillblank'+qi); if(blankEl){blankEl.textContent=q.answer;blankEl.style.borderStyle='solid';blankEl.style.borderColor=isCorrect?'var(--correct)':'var(--wrong)';}
  const qEl=document.getElementById('fillq'+qi); qEl.classList.add(isCorrect?'correct-anim':'wrong-anim'); setTimeout(()=>qEl.classList.remove('correct-anim','wrong-anim'),500);
  document.getElementById('filldot'+qi).classList.add(isCorrect?'correct':'wrong');
  if(isCorrect){speak(q.sentence.replace(q.blank,q.answer));showToast('✅ 正确！','green');}else showToast(`答案是 "${q.answer}"`,'red');
  fillAnswered++; if(fillAnswered>=fillQuestions.length){const b=document.getElementById('btn4');b.className='btn btn-primary';b.textContent='完成本课 🎉';}
}

function goStage(n){ document.getElementById('screen'+currentStage).classList.remove('active'); document.getElementById('screen'+n).classList.add('active'); ['dot0','dot1','dot2','dot3'].forEach((id,i)=>{const el=document.getElementById(id);if(i<n-1){el.classList.remove('active');el.classList.add('done');}else if(i===n-1){el.classList.add('active');el.classList.remove('done');}else el.classList.remove('active','done');}); currentStage=n; starsEarned=n-1; updateStars(); updateProgress((n-1)/4*100); window.scrollTo(0,0); }
function finishLesson(){starsEarned=4;updateStars();updateProgress(100);saveProgress();renderFinish();goStage(5);launchConfetti();}
function renderFinish(){ document.getElementById('finishStars').textContent='⭐'.repeat(starsEarned)+'☆'.repeat(4-starsEarned); const list=document.getElementById('reviewList'); list.innerHTML=''; textLines.forEach(pair=>{ [pair.q,pair.a].forEach(line=>{const div=document.createElement('div');div.className='review-line';div.onclick=()=>speak(line);div.innerHTML=`<span>${line}</span><span class="review-play">▶️</span>`;list.appendChild(div);}); }); }
function updateStars(){['star1','star2','star3','star4'].forEach((id,i)=>{const el=document.getElementById(id);const prev=el.textContent;el.textContent=i<starsEarned?'⭐':'☆';if(i<starsEarned&&prev==='☆'){el.classList.add('earned');setTimeout(()=>el.classList.remove('earned'),600);}});}
function updateProgress(pct){document.getElementById('progressBar').style.width=pct+'%';}
function saveProgress(){ try{const data=JSON.parse(localStorage.getItem('nce_progress')||'{}');const prev=data['12'];if(!prev||starsEarned>prev.stars)data['12']={stars:starsEarned,date:new Date().toISOString()};localStorage.setItem('nce_progress',JSON.stringify(data));const sd=JSON.parse(localStorage.getItem('nce_streak')||'{"days":0,"last":""}');const today=new Date().toDateString();if(sd.last!==today){sd.days=sd.last===new Date(Date.now()-86400000).toDateString()?sd.days+1:1;sd.last=today;}localStorage.setItem('nce_streak',JSON.stringify(sd));}catch(e){} }
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1800);}
function launchConfetti(){ const wrap=document.getElementById('confettiWrap');wrap.innerHTML=''; const colors=['#AB47BC','#FF6F00','#00ACC1','#43A047','#EC407A','#1565C0','#FFD600']; for(let i=0;i<55;i++){const el=document.createElement('div');el.className='cf';el.style.left=Math.random()*100+'vw';el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.animationDuration=(1.5+Math.random()*2)+'s';el.style.animationDelay=(Math.random()*0.8)+'s';const sz=(7+Math.random()*10)+'px';el.style.width=el.style.height=sz;wrap.appendChild(el);} setTimeout(()=>wrap.innerHTML='',4000); }
</script>
</body>
</html>
