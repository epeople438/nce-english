    position: relative;
    text-decoration: none;
    display: block;

  /* DONE state */
  .lesson-card.done {
    background: linear-gradient(135deg, #43A047, #2E7D32);
    box-shadow: 0 4px 14px rgba(67,160,71,0.4);

  .lesson-card.current {

  }

  .lesson-card.locked {

    cursor: not-allowed;

    margin-bottom: 4px;

// ===== PROGRESS from localStorage =====
function getProgress() {
  try {
    return JSON.parse(localStorage.getItem('nce_progress') || '{}');
  } catch { return {}; }
}

function getTotalDone() {
  const p = getProgress();
  return Object.keys(p).filter(k => p[k] && p[k].stars > 0).length;
}

function getTotalStars() {
  const p = getProgress();
  return Object.values(p).reduce((sum, v) => sum + (v.stars || 0), 0);
}

function getStreak() {
  try {
    const s = JSON.parse(localStorage.getItem('nce_streak') || '{"days":1,"last":""}');
    const today = new Date().toDateString();
    if(s.last !== today) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      s.days = (s.last === yesterday) ? s.days + 1 : 1;
      s.last = today;
      localStorage.setItem('nce_streak', JSON.stringify(s));
    }
    return s.days;
  } catch { return 1; }
}

// ===== BUILD GRID =====
function buildGrid(unitNum, containerId) {
  const container = document.getElementById(containerId);
  const progress = getProgress();
  const unitLessons = lessons.filter(l => l.unit === unitNum);
  const totalDone = getTotalDone();

  unitLessons.forEach(lesson => {
    const p = progress[lesson.id] || {};
    const isDone = p.stars > 0;
    const isCurrent = !isDone && (lesson.id === 1 || progress[lesson.id - 1]?.stars > 0 || (lesson.id === totalDone + 1));
    const isFirst = lesson.id === 1;
    const isLocked = !isDone && !isCurrent && !isFirst;

    const card = document.createElement('a');
    card.className = 'lesson-card ' + (isDone ? 'done' : isCurrent || isFirst ? 'current' : 'locked');

    if(!isLocked) {
      card.href = `./lessons/lesson${lesson.id}.html`;
    } else {
      card.onclick = (e) => { e.preventDefault(); showLockedHint(); };
      card.href = '#';
    }

    const starsStr = isDone ? '⭐'.repeat(p.stars) : '';

    card.innerHTML = `
      ${!isDone && !isFirst && (isCurrent) ? '<div class="new-badge">NEW</div>' : ''}
      ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
      <div class="lesson-num">${lesson.id}</div>
      <span class="lesson-icon">${lesson.icon}</span>
      <div class="lesson-name">${lesson.name}</div>
      ${starsStr ? `<div class="lesson-stars">${starsStr}</div>` : ''}
    `;
    container.appendChild(card);
  });
}

function showLockedHint() {
  const hint = document.createElement('div');
  hint.style.cssText = `
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:#1A237E; color:white; padding:12px 20px; border-radius:999px;
    font-weight:700; font-size:0.9rem; z-index:999;
    box-shadow:0 4px 20px rgba(0,0,0,0.3); white-space:nowrap;
    animation: fadeInUp 0.3s ease;
  `;
  hint.textContent = '🔒 先完成前一课，才能解锁这课！';
  document.body.appendChild(hint);
  setTimeout(() => hint.remove(), 2500);
}

// ===== INIT =====
const streak = getStreak();
const done = getTotalDone();
const stars = getTotalStars();

document.getElementById('stat-done').textContent = done;
document.getElementById('stat-stars').textContent = stars;
document.getElementById('stat-streak').textContent = streak;
document.getElementById('streak-days').textContent = `Day ${streak}`;

buildGrid(1, 'grid-unit1');
buildGrid(2, 'grid-unit2');
buildGrid(3, 'grid-unit3');
buildGrid(4, 'grid-unit4');

// Update continue button
const progress = getProgress();
let nextLesson = 1;
for(let i = 1; i <= 96; i++) {
  if(!progress[i] || !progress[i].stars) { nextLesson = i; break; }
}
const cta = document.querySelector('.bottom-cta');
const ctaSub = cta.querySelector('.cta-sub');
const lessonData = lessons.find(l => l.id === nextLesson);
cta.href = `./lessons/lesson${nextLesson}.html`;
if(lessonData) ctaSub.textContent = `Lesson ${nextLesson} · ${lessonData.name}`;

// Register service worker
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    console.log('SW registered:', reg.scope);
  }).catch(err => console.log('SW error:', err));
}
</script>
</body>
</html>
